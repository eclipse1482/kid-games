<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#101a2b">
<title>Spark Lab</title>
<style>
:root{--bg:#101a2b;--panel:#1a2840;--line:#ffffff1f;--text:#f2f8ff;--dim:#9fb3c8;--accent:#ffd54f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,Arial,sans-serif}
body{height:100dvh;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0}
#app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr);gap:6px;
  padding:max(6px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
#hud{display:flex;align-items:center;gap:6px;padding:4px 8px;background:linear-gradient(#26406a,#182a46);border:1px solid var(--line);border-radius:12px}
.hb{width:40px;height:40px;border-radius:11px;background:#0d1626;border:1px solid var(--line);font-size:19px;flex:none;display:grid;place-items:center}
.brand{font-weight:900;letter-spacing:1px;font-size:15px;color:var(--accent);white-space:nowrap}
.brand small{color:var(--dim);font-size:9px;letter-spacing:.5px}
#title{flex:1;min-width:0;text-align:center;font-weight:900;font-size:15px;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#main{min-height:0;min-width:0;display:grid;gap:6px;grid-template-columns:minmax(0,1fr) clamp(190px,25vw,290px)}
#boardWrap{position:relative;min-height:0;min-width:0;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#16263d}
#cv{display:block;width:100%;height:100%;touch-action:none}
#goal{position:absolute;left:8px;top:8px;right:8px;display:flex;gap:6px;align-items:center;pointer-events:none;flex-wrap:wrap}
#goal .gtxt{background:#000a;border-radius:12px;padding:5px 10px;font-weight:900;font-size:clamp(12px,2.3vh,15px)}
.chip{position:relative;display:flex;align-items:center;gap:4px;background:#000a;border:2px solid #ffffff22;border-radius:12px;padding:2px 8px 2px 2px}
.chip canvas{width:clamp(30px,6vh,40px);height:clamp(30px,6vh,40px)}
.chip span{font-weight:900;font-size:clamp(10px,1.9vh,13px);color:var(--dim);white-space:nowrap}
.chip.ok{border-color:#5ff29a;background:#0d3a22cc}
.chip.ok span{color:#5ff29a}
.chip .ck{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:#5ff29a;color:#06210f;font-weight:900;font-size:14px;display:none;place-items:center}
.chip.ok .ck{display:grid}
#tip{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);max-width:94%;padding:8px 14px;border-radius:14px;background:#000c;font-weight:900;
  font-size:clamp(13px,2.5vh,16px);text-align:center;opacity:0;transition:opacity .3s;pointer-events:none}
#tip.on{opacity:1}
#tip.warn{background:#8a1c1ce6}
#tray{position:relative;min-height:0;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;display:flex;flex-direction:column;gap:6px}
#parts{flex:1;min-height:0;display:flex;flex-direction:column;gap:5px}
.grp{min-height:0;display:flex;flex-direction:column;gap:3px;border-radius:12px;padding:3px 4px 4px;border:2px solid transparent}
.grp .gh{font-size:clamp(9px,1.6vh,11px);font-weight:900;letter-spacing:.8px;padding-left:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp .gt{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:4px}
.grp.power{flex:1;background:#3a2a0c;border-color:#ffb30055}.grp.power .gh{color:#ffcc66}
.grp.link{flex:1;background:#0e2a44;border-color:#40a9ff55}.grp.link .gh{color:#8fd0ff}
.grp.use{flex:3;background:#10321f;border-color:#4cd18055}.grp.use .gh{color:#8ff0b4}
.tile{border-radius:12px;background:#0d1626;border:2px solid #ffffff14;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;min-width:0;padding:2px;touch-action:none;cursor:grab}
.tile canvas{width:100%;flex:1;min-height:0;object-fit:contain;pointer-events:none}
.tile span{font-size:clamp(9px,1.7vh,12px);font-weight:900;color:var(--dim);white-space:nowrap;pointer-events:none}
.tile.sel{border-color:var(--accent);background:#4a3c0c;box-shadow:0 0 0 2px var(--accent),0 0 14px #ffd54f99;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
#dropZone{position:absolute;inset:0;z-index:5;border-radius:14px;display:none;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  background:#1a0f12e6;border:3px dashed #ff8a80aa;color:#ffb4ab;font-weight:900;font-size:clamp(13px,2.6vh,17px);text-align:center;pointer-events:none;padding:8px}
#dropZone b{font-size:clamp(30px,7vh,48px);line-height:1;transition:transform .15s}
#tray.dragging #dropZone{display:flex}
#tray.hot #dropZone{background:#5a1414ee;border-color:#ff5252;border-style:solid;color:#fff}
#tray.hot #dropZone b{transform:scale(1.25) rotate(-8deg)}
#tools{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.tb{border-radius:12px;padding:6px 4px;font-weight:900;font-size:clamp(12px,2.2vh,15px);background:#2b3f5c;color:#fff;min-height:clamp(38px,7vh,50px)}
.tb.on{background:var(--accent);color:#2a1d00}
.tb.arm{background:#c8392f}
#ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:50;display:none}
.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:8px;background:#060c16d9;backdrop-filter:blur(3px)}
.overlay.hidden{display:none}
.card{width:min(820px,100%);max-height:calc(100dvh - 16px);overflow:auto;padding:12px 16px;text-align:center;background:linear-gradient(#25416b,#152540);
  border:1px solid #ffffff2a;border-radius:20px;box-shadow:0 24px 70px #000c;display:flex;flex-direction:column;gap:8px;touch-action:pan-y}
.card.small{width:min(520px,100%)}
.card h1{margin:0;font-size:clamp(22px,4.6vw,34px);letter-spacing:1px;color:var(--accent);text-shadow:0 3px 0 #0006}
.sub{color:var(--dim);font-weight:700;font-size:13px}
.big{border-radius:16px;padding:10px;font-weight:900;font-size:clamp(16px,3.2vh,22px);letter-spacing:.5px;color:#062612;background:linear-gradient(#5ff29a,#22b866);box-shadow:0 5px 0 #148a4a;
  display:flex;align-items:center;justify-content:center;gap:8px}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #148a4a}
.big.blue{background:linear-gradient(#69c3ff,#2a86e0);color:#fff;box-shadow:0 5px 0 #1c5fa3}
.big.ghostb{background:#2b3f5c;color:#fff;box-shadow:none}
.sec{font-weight:900;color:var(--dim);font-size:11px;letter-spacing:1.2px;text-align:left}
#missions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.mt{position:relative;border-radius:14px;background:#0d1626;border:3px solid #ffffff14;padding:4px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:1px}
.mt canvas{width:70%;aspect-ratio:1;pointer-events:none}
.mt b{font-size:clamp(11px,2.1vh,14px);white-space:nowrap}
.mt .n{position:absolute;top:4px;left:7px;font-weight:900;color:var(--dim);font-size:13px}
.mt .st{position:absolute;top:2px;right:6px;font-size:16px}
.mt.done{border-color:#ffd54f88}
.fact{background:#0d1626;border-radius:14px;padding:10px 12px;font-weight:800;font-size:clamp(14px,2.8vh,18px);line-height:1.35}
.bstar{font-size:clamp(50px,12vh,80px);line-height:1;animation:pop .6s}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.row{display:flex;gap:8px}.row>*{flex:1}
.ver{font-size:10px;color:var(--dim);font-weight:800;opacity:.7}
@media (orientation:landscape) and (max-height:500px){ .card{padding:8px 12px;gap:5px} .mt canvas{width:52%} }
@media (orientation:portrait){
  .brand{display:none}
  #main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  #tray{height:min(27dvh,260px)}
  #parts{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
  .grp.use{grid-column:1 / span 2}
  .grp.use .gt{grid-template-columns:repeat(6,minmax(0,1fr))}
  #missions{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>
<body>
<main id="app">
  <header id="hud">
    <button class="hb" id="homeBtn" type="button" aria-label="Menu">🏠</button>
    <div class="brand">⚡ SPARK LAB <small>v5</small></div>
    <div id="title">PLAY LAB</div>
    <button class="hb" id="hintBtn" type="button" aria-label="Hint">💡</button>
    <button class="hb" id="sunBtn" type="button" aria-label="Day or night">☀️</button>
    <button class="hb" id="muteBtn" type="button" aria-label="Sound">🔊</button>
  </header>
  <section id="main">
    <div id="boardWrap"><canvas id="cv"></canvas><div id="goal"></div><div id="tip"></div></div>
    <aside id="tray">
      <div id="parts"></div>
      <div id="tools"><button class="tb" id="eraseBtn" type="button">🧽 ERASE</button><button class="tb" id="clearBtn" type="button">🗑️ CLEAR</button></div>
      <div id="dropZone"><b>🗑️</b>Drop here<br>to remove</div>
    </aside>
  </section>
</main>
<canvas id="ghost"></canvas>

<div class="overlay" id="menu">
  <div class="card">
    <h1>⚡ SPARK LAB</h1>
    <div class="sub">Build circuits and watch the electricity flow!</div>
    <button class="big blue" id="labBtn" type="button">🧪 PLAY LAB — build anything!</button>
    <div class="sec">⭐ MISSIONS</div>
    <div id="missions"></div>
    <div class="ver">Version 5 · tap a part, then tap the board · drag parts back to the tray to remove them</div>
  </div>
</div>

<div class="overlay hidden" id="done">
  <div class="card small">
    <div class="bstar">⭐</div>
    <h1>CIRCUIT COMPLETE!</h1>
    <div class="fact" id="fact"></div>
    <button class="big" id="nextBtn" type="button">NEXT MISSION ➜</button>
    <div class="row"><button class="big ghostb" id="keepBtn" type="button">KEEP PLAYING</button><button class="big ghostb" id="menuBtn" type="button">MISSIONS</button></div>
  </div>
</div>

<script>
'use strict';
(function(){
['contextmenu','selectstart','dragstart','gesturestart'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
let lastTE=0;
document.addEventListener('touchend',e=>{ const n=Date.now(); if(n-lastTE<350&&e.target.closest('button,canvas,.tile,.mt')) e.preventDefault(); lastTE=n; },{passive:false});

const $=id=>document.getElementById(id);
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, rnd=(a,b)=>a+Math.random()*(b-a);
function onTap(el,fn){
  let d=null;
  el.addEventListener('pointerdown',e=>{ if(e.pointerType==='mouse'&&e.button!==0) return; d={x:e.clientX,y:e.clientY,id:e.pointerId}; });
  el.addEventListener('pointerup',e=>{ if(!d||d.id!==e.pointerId) return; const m=Math.hypot(e.clientX-d.x,e.clientY-d.y); d=null; if(m<16){ initAudio(); fn(e); } });
  el.addEventListener('pointercancel',()=>d=null);
}
function rr(c,x,y,w,h,r){ r=Math.min(r,w/2,h/2); c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function circ(c,x,y,r){ c.beginPath(); c.arc(x,y,r,0,TAU); }

/* ---------- SOUND ---------- */
let AC=null, master=null, muted=false;
function initAudio(){
  if(AC){ AC.resume&&AC.resume(); return; }
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=.5; master.connect(AC.destination); }catch(e){ AC=null; }
}
function tone(f,d,type,vol,delay,slide){
  if(!AC||muted) return;
  const t0=AC.currentTime+(delay||0), o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t0); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t0+d);
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol||.2,t0+.01); g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0+d+.05);
}
const sfx={
  snap:()=>{ tone(520,.06,'square',.05); tone(780,.08,'triangle',.08,.03); },
  wire:()=>tone(rnd(900,1100),.04,'triangle',.06),
  pop:()=>tone(600,.15,'sine',.12,0,200),
  flip:()=>{ tone(700,.07,'triangle',.08); tone(500,.07,'triangle',.08,.07); },
  swOn:()=>{ tone(1200,.04,'square',.05); tone(1600,.06,'triangle',.06,.03); },
  swOff:()=>{ tone(900,.04,'square',.05); tone(600,.06,'triangle',.06,.03); },
  on:()=>[784,988,1319].forEach((f,i)=>tone(f,.15,'triangle',.11,i*.07)),
  warn:()=>{ tone(420,.15,'triangle',.12); tone(420,.15,'triangle',.12,.22); },
  buzz:k=>tone(k?660:880,.1,'square',.03),
  boop:()=>{ tone(880,.08,'square',.04); tone(660,.08,'square',.04,.1); tone(990,.12,'square',.04,.2); },
  nope:()=>tone(240,.12,'triangle',.1),
  fanfare:()=>{ [523,659,784,1047].forEach((f,i)=>tone(f,.28,'triangle',.18,i*.13)); tone(1047,.8,'triangle',.15,.55); tone(1319,.8,'triangle',.1,.55); }
};

/* ---------- BOARD ---------- */
const NX=7, NY=5, nid=(x,y)=>y*NX+x;
const EDGES=[], EBY={};
for(let y=0;y<NY;y++) for(let x=0;x<NX-1;x++){ const E={k:'h',x,y,a:nid(x,y),b:nid(x+1,y),key:'h'+x+','+y}; EDGES.push(E); EBY[E.key]=E; }
for(let y=0;y<NY-1;y++) for(let x=0;x<NX;x++){ const E={k:'v',x,y,a:nid(x,y),b:nid(x,y+1),key:'v'+x+','+y}; EDGES.push(E); EBY[E.key]=E; }
function edgeBetween(n1,n2){ for(const E of EDGES) if((E.a===n1&&E.b===n2)||(E.a===n2&&E.b===n1)) return E; return null; }

const TYPES=['wire','battery','bulb','switch','motor','fan','buzzer','led','solar','robot'];
const NAMES={wire:'WIRE',battery:'BATTERY',bulb:'LIGHT',switch:'SWITCH',motor:'MOTOR',fan:'FAN',buzzer:'BUZZER',led:'LED',solar:'SOLAR',robot:'ROBOT'};
const LOADS=new Set(['bulb','motor','fan','buzzer','led','robot']);
let pid=1;
function mkPart(t,e,dir,sw){ return {id:pid++,t,e,dir:dir||1,sw:!!sw,ph:Math.random(),ang:0,lv:sw?1:0,I:0,on:false,lvl:0,pop:0}; }

/* ---------- MISSIONS ---------- */
const P=(t,k,x,y,dir,sw)=>({t,e:k+x+','+y,dir:dir||1,sw:!!sw});
const W=(k,x,y)=>P('wire',k,x,y);
const MISSIONS=[
  {name:'Light It Up!',icon:'bulb',goal:'Draw wires to finish the circle!',
   pre:[P('battery','v',2,1),W('v',2,2),P('bulb','v',4,1),W('v',4,2),W('h',2,1),W('h',3,1)],
   sol:[W('h',2,3),W('h',3,3)],targets:[{t:'bulb',l:'LIGHT'}],
   fact:'💡 Electricity needs a complete circle to flow. That circle is called a <b>CIRCUIT</b>!'},
  {name:'Fan Power',icon:'fan',goal:'Connect the battery to the fan!',
   pre:[P('battery','v',2,1),P('fan','v',4,1)],
   sol:[W('v',2,2),W('v',4,2),W('h',2,1),W('h',3,1),W('h',2,3),W('h',3,3)],targets:[{t:'fan',l:'FAN'}],
   fact:'🌀 A motor inside the fan turns electricity into <b>spinning</b>!'},
  {name:'Light Switch',icon:'switch',goal:'Put a switch in the gap, then tap it ON!',
   pre:[P('battery','v',2,1),W('v',2,2),P('bulb','v',4,1),W('v',4,2),W('h',2,1),W('h',3,1),W('h',2,3)],
   sol:[P('switch','h',3,3,1,true)],targets:[{t:'bulb',l:'LIGHT'},{t:'switch',l:'SWITCH',icon:'switch'}],
   fact:'🔘 A switch opens and closes the circle. <b>OFF</b> makes a gap, so the electricity stops!'},
  {name:'Two Lights',icon:'bulb2',goal:'Make TWO lights glow at the same time!',
   pre:[P('battery','v',1,1),W('v',1,2)],
   sol:[W('h',1,1),P('bulb','h',2,1),W('h',3,1),P('bulb','h',4,1),W('v',5,1),W('v',5,2),W('h',1,3),W('h',2,3),W('h',3,3),W('h',4,3)],
   targets:[{t:'bulb',n:2,l:'2 LIGHTS'}],
   fact:'💡💡 Lights in a row <b>share</b> the electricity, so each one glows a little dimmer.'},
  {name:'Sun Power',icon:'solar',goal:'No batteries! Use the sun to light the bulb.',noBattery:true,day:true,
   pre:[P('solar','v',2,1),W('v',2,2),P('bulb','v',4,1),W('v',4,2),W('h',2,1),W('h',3,1)],
   sol:[W('h',2,3),W('h',3,3)],targets:[{t:'solarbulb',l:'SUN LIGHT',icon:'solar'}],
   fact:'☀️ Solar panels turn <b>sunshine</b> into electricity! Tap the 🌙 button. What happens?'},
  {name:'Super Bright',icon:'super',goal:'Fill the gap. Can you make the light SUPER bright?',
   pre:[P('battery','v',2,1),P('bulb','v',4,1),W('v',4,2),W('h',2,1),W('h',3,1),W('h',2,3),W('h',3,3)],
   sol:[P('battery','v',2,2)],targets:[{t:'bulb',l:'LIGHT'},{t:'super',l:'SUPER BRIGHT',icon:'super'}],
   fact:'🔋🔋 Two batteries push the electricity <b>twice as hard</b>. Super bright!'},
  {name:'One-Way Light',icon:'led',goal:'Put an LED in the gap and make it glow!',
   pre:[P('battery','v',2,1),W('v',2,2),W('v',4,2),W('h',2,1),W('h',3,1),W('h',2,3),W('h',3,3)],
   sol:[P('led','v',4,1)],targets:[{t:'led',l:'LED'}],
   fact:'🔴 An LED only lets electricity go <b>ONE way</b>. Tap it to flip it around and see!'},
  {name:'Robot Party',icon:'robot',goal:'Power a light, a fan, a buzzer AND a robot!',
   pre:[P('battery','v',1,1),W('v',1,2)],
   sol:[W('h',1,1),W('h',2,1),W('h',3,1),W('h',4,1),W('h',1,3),W('h',2,3),W('h',3,3),W('h',4,3),
        P('bulb','v',2,1),W('v',2,2),P('fan','v',3,1),W('v',3,2),P('buzzer','v',4,1),W('v',4,2),P('robot','v',5,1),W('v',5,2)],
   targets:[{t:'bulb',l:'LIGHT'},{t:'fan',l:'FAN'},{t:'buzzer',l:'BUZZER'},{t:'robot',l:'ROBOT'}],
   fact:'🎉 One battery can power lots of things when each one gets <b>its own path</b>!'}
];

/* ---------- STATE & SAVE ---------- */
let MODE='menu', MI=-1, parts=[], sun=true, eraser=false, SOL={V:null}, met=[], doneT=-1, completed=false;
let stars=[]; try{ stars=JSON.parse(localStorage.getItem('spark-lab-stars')||'[]')||[]; }catch(e){ stars=[]; }
function saveStars(){ try{ localStorage.setItem('spark-lab-stars',JSON.stringify(stars)); }catch(e){} }
function saveLab(){ if(MODE!=='lab') return; try{ localStorage.setItem('spark-lab-board',JSON.stringify({sun,parts:parts.map(p=>({t:p.t,e:p.e,dir:p.dir,sw:p.sw}))})); }catch(e){} }
function loadLab(){ try{ const S=JSON.parse(localStorage.getItem('spark-lab-board')||'null'); if(S&&Array.isArray(S.parts)){ sun=S.sun!==false; return S.parts.filter(p=>EBY[p.e]&&TYPES.includes(p.t)).map(p=>mkPart(p.t,p.e,p.dir,p.sw)); } }catch(e){} return []; }
const partAt=key=>parts.find(p=>p.e===key);

/* ============================================================
   CIRCUIT SOLVER — real nodal analysis
   Battery = 1V with 0.1Ω inside · Solar = 1V with 0.2Ω (sun only)
   Every light/motor/fan/buzzer/robot/LED = 1Ω · Wire & ON switch = 0.001Ω
   A shorted power source is handled by the physics itself: its two ends
   end up at (almost) the same voltage, so it can't push anything else —
   but OTHER power sources elsewhere in the circuit still work normally.
   ============================================================ */
const WIRE_G=1000;
function gauss(A,N){
  for(let i=0;i<N;i++){
    let mx=i; for(let r=i+1;r<N;r++) if(Math.abs(A[r][i])>Math.abs(A[mx][i])) mx=r;
    if(mx!==i){ const t=A[i]; A[i]=A[mx]; A[mx]=t; }
    const p=A[i][i]||1e-12;
    for(let r=i+1;r<N;r++){ const f=A[r][i]/p; if(!f) continue; for(let k=i;k<=N;k++) A[r][k]-=f*A[i][k]; }
  }

/* ---------- TRAY ---------- */
const GROUPS=[
  {k:'power',n:'⚡ POWER',t:['battery','solar']},
  {k:'link', n:'🔗 CONNECT',t:['wire','switch']},
  {k:'use',  n:'💡 THINGS THAT USE POWER',t:['bulb','led','fan','motor','buzzer','robot']}];
let SELT=null;
const partsEl=$('parts'), trayEl=$('tray'), ghost=$('ghost'), gctx=ghost.getContext('2d');
function syncSel(){ partsEl.querySelectorAll('.tile').forEach(x=>x.classList.toggle('sel',x.dataset.t===SELT)); }
function clearSel(){ SELT=null; syncSel(); }
function selectTile(t){
  if(SELT===t){ clearSel(); sfx.pop(); return; }
  SELT=t; eraser=false; $('eraseBtn').classList.remove('on'); syncSel(); sfx.snap();
  showTip('👆 Tap a spot on the board for the '+NAMES[t].toLowerCase()+'!');
}
function buildTray(){
  const M=MODE==='mission'?MISSIONS[MI]:null;
  const ok=t=>!(M&&M.noBattery&&t==='battery');
  partsEl.innerHTML=GROUPS.map(g=>'<div class="grp '+g.k+'"><div class="gh">'+g.n+'</div><div class="gt">'+
    g.t.filter(ok).map(t=>'<div class="tile'+(SELT===t?' sel':'')+'" data-t="'+t+'"><canvas width="160" height="110"></canvas><span>'+NAMES[t]+'</span></div>').join('')+'</div></div>').join('');
  partsEl.querySelectorAll('.tile').forEach(tl=>{ drawIcon(tl.querySelector('canvas'),tl.dataset.t,false); hookTile(tl); });
}
let DRAG=null;
function hookTile(tl){
  tl.addEventListener('pointerdown',e=>{ if(e.pointerType==='mouse'&&e.button!==0) return; e.preventDefault(); initAudio();
    tl.setPointerCapture(e.pointerId); DRAG={kind:'new',t:tl.dataset.t,sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY,moved:false,tile:tl,target:null}; });
  tl.addEventListener('pointermove',e=>{ if(!DRAG||DRAG.tile!==tl) return; dragMove(e.clientX,e.clientY); });
  tl.addEventListener('pointerup',e=>{ if(!DRAG||DRAG.tile!==tl) return; dragEnd(e.clientX,e.clientY); });
  tl.addEventListener('pointercancel',()=>{ DRAG=null; ghost.style.display='none'; });
}
function toCanvas(cx_,cy_){ const r=cv.getBoundingClientRect(); return {x:(cx_-r.left)*(cv.width/r.width),y:(cy_-r.top)*(cv.height/r.height)}; }
function nearestEdge(pt,maxF){
  let best=null,bd=1e9; for(const E of EDGES){ const [A,B]=epts(E.key), mx=(A.x+B.x)/2, my=(A.y+B.y)/2, d=Math.hypot(pt.x-mx,pt.y-my); if(d<bd){ bd=d; best=E; } }
  return bd<VW.cell*(maxF||.55)?best:null;
}
function nearestNode(pt,maxF){ let best=-1,bd=1e9; for(let n=0;n<NX*NY;n++){ const q=npos(n), d=Math.hypot(pt.x-q.x,pt.y-q.y); if(d<bd){ bd=d; best=n; } } return bd<VW.cell*(maxF||.35)?best:-1; }
function inBoard(pt){ const b=boardRect(); return pt.x>=b.x&&pt.x<=b.x+b.w&&pt.y>=b.y&&pt.y<=b.y+b.h; }

function dragMove(x,y){
  const D=DRAG; D.x=x; D.y=y;
  if(!D.moved&&Math.hypot(x-D.sx,y-D.sy)>10) D.moved=true;
  if(!D.moved) return;
  const pt=toCanvas(x,y); D.target=inBoard(pt)?nearestEdge(pt,.75):null;
  if(D.kind==='move') trayEl.classList.toggle('hot',overTray(x,y));
  if(D.target){ ghost.style.display='none'; }
  else { const sz=Math.round(VW.cell/VW.DPR*1.3); ghost.width=sz*2; ghost.height=sz*2; ghost.style.width=sz+'px'; ghost.style.height=sz+'px'; ghost.style.left=(x-sz/2)+'px'; ghost.style.top=(y-sz/2)+'px'; ghost.style.display='block';
    gctx.clearRect(0,0,sz*2,sz*2); const s=sz*2*.75, P={x:sz-s/2,y:sz*1.15}, Q={x:sz+s/2,y:sz*1.15}; const gp=D.part||mkPart(D.t,'h0,0'); drawFull(gctx,gp,P,Q,s,0); }
}
function dragEnd(x,y){

function placePart(t,key,dir,sw,keepId){

  const p=keepId||mkPart(t,key,dir,sw); p.e=key; p.pop=1; parts.push(p); sfx.snap(); solve(); return p;
}
function endTrayDrop(){ trayEl.classList.remove('dragging','hot'); }

/* ---------- BOARD INPUT ---------- */
let BD=null;
cv.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0) return; e.preventDefault(); initAudio();
  cv.setPointerCapture(e.pointerId);
  const pt=toCanvas(e.clientX,e.clientY);
  if(eraser){ BD={kind:'erase'}; eraseAt(pt); return; }
  if(SELT){ BD={kind:'place',sx:e.clientX,sy:e.clientY,n:nearestNode(pt,.3),pt}; return; }
  const E=nearestEdge(pt,.36), pp=E&&partAt(E.key);
  const n=nearestNode(pt,.3);
  if(n>=0&&!(pp&&pp.t!=='wire'&&distToMid(pt,E)<VW.cell*.25)){ BD={kind:'wire',last:n}; return; }
  if(pp){ BD={kind:'part',part:pp,from:pp.e,sx:e.clientX,sy:e.clientY,moved:false}; return; }
  BD=null;
},{passive:false});
function distToMid(pt,E){ const [A,B]=epts(E.key); return Math.hypot(pt.x-(A.x+B.x)/2,pt.y-(A.y+B.y)/2); }
cv.addEventListener('pointermove',e=>{
  if(!BD) return; const pt=toCanvas(e.clientX,e.clientY);
  if(BD.kind==='erase'){ eraseAt(pt); return; }
  if(BD.kind==='place'){ if(Math.hypot(e.clientX-BD.sx,e.clientY-BD.sy)>14){ if(BD.n>=0){ clearSel(); BD={kind:'wire',last:BD.n}; } else BD=null; } return; }
  if(BD.kind==='wire'){
    const n=nearestNode(pt,.4); if(n<0||n===BD.last) return;
    const ax=BD.last%NX, ay=(BD.last/NX)|0, bx=n%NX, by=(n/NX)|0;
    if(ax!==bx&&ay!==by) return;
    const sx=Math.sign(bx-ax), sy=Math.sign(by-ay); let cxn=BD.last, added=false;
    while(cxn!==n){ const nx=(cxn%NX)+sx, ny=((cxn/NX)|0)+sy, nn=nid(nx,ny), E=edgeBetween(cxn,nn);
      if(E&&!partAt(E.key)){ const w=mkPart('wire',E.key); w.pop=.6; parts.push(w); added=true; } cxn=nn; }
    BD.last=n; if(added){ sfx.wire(); solve(); }
    return;
  }
  if(BD.kind==='part'){
    if(!BD.moved&&Math.hypot(e.clientX-BD.sx,e.clientY-BD.sy)>12){
      BD.moved=true; parts=parts.filter(p=>p!==BD.part); solve();
      DRAG={kind:'move',part:BD.part,t:BD.part.t,sx:BD.sx,sy:BD.sy,moved:true};
      trayEl.classList.add('dragging');
    }
    if(BD.moved) dragMove(e.clientX,e.clientY);
  }
});
function endBoard(e){
  if(!BD) return; const B=BD; BD=null;
  if(B.kind==='place'){ placeSelected(B.pt); return; }
  if(B.kind==='part'){
    if(!B.moved){ tapPart(B.part); return; }
    const D=DRAG; DRAG=null; ghost.style.display='none';
    const toTray=overTray(e.clientX,e.clientY); endTrayDrop();
    if(toTray){ sfx.pop(); showTip('👋 Bye bye, '+NAMES[B.part.t].toLowerCase()+'!'); solve(); }
    else if(D&&D.target){ placePart(B.part.t,D.target.key,B.part.dir,B.part.sw,B.part); }
    else { B.part.e=B.from; parts.push(B.part); B.part.pop=1; sfx.nope(); solve(); }
  }
}
cv.addEventListener('pointerup',endBoard);
cv.addEventListener('pointercancel',()=>{ if(BD&&BD.kind==='part'&&BD.moved){ BD.part.e=BD.from; parts.push(BD.part); solve(); } BD=null; DRAG=null; ghost.style.display='none'; endTrayDrop(); });
function placeSelected(pt){
  const t=SELT;
  if(!inBoard(pt)){ clearSel(); sfx.pop(); return; }
  const E=nearestEdge(pt,.6); if(!E){ sfx.nope(); return; }
  clearSel();
  const old=partAt(E.key);
  if(old&&old.t===t){ tapPart(old); return; }
  placePart(t,E.key,1,false);
}
function tapPart(p){
  p.pop=1;
  if(p.t==='switch'){ p.sw=!p.sw; (p.sw?sfx.swOn:sfx.swOff)(); solve(); }
  else if(p.t==='battery'||p.t==='led'||p.t==='solar'){ p.dir=-p.dir; sfx.flip(); solve(); }
  else if(p.t==='robot'&&p.on) sfx.boop();
  else sfx.snap();
}
function eraseAt(pt){ const E=nearestEdge(pt,.45); if(!E) return; const p=partAt(E.key); if(!p) return; parts=parts.filter(q=>q!==p); sfx.pop(); solve(); }

/* ---------- DRAW LOOP ---------- */
let T=0, hintT=0, buzzT=0, buzzK=0, robotT=0;
function draw(dt){
  sizeCanvas(); const c=cx, w=cv.width, h=cv.height, s=VW.cell, night=!sun;
  T+=dt;
  c.fillStyle=night?'#070c16':'#16263d'; c.fillRect(0,0,w,h);
  const b=boardRect();
  c.fillStyle=night?'#0f1828':'#21385a'; rr(c,b.x,b.y,b.w,b.h,s*.25); c.fill();
  c.strokeStyle=night?'#ffffff10':'#ffffff1c'; c.lineWidth=s*.03; c.setLineDash([s*.05,s*.09]);
  for(const E of EDGES){ const [A,B]=epts(E.key); c.beginPath(); c.moveTo(A.x,A.y); c.lineTo(B.x,B.y); c.stroke(); }
  c.setLineDash([]);
  if(sun){ c.fillStyle='#ffd54f'; circ(c,b.x+b.w-s*.28,b.y+s*.28,s*.13); c.fill(); }
  else { c.fillStyle='#e3f2fd'; circ(c,b.x+b.w-s*.28,b.y+s*.28,s*.13); c.fill(); c.fillStyle='#0f1828'; circ(c,b.x+b.w-s*.22,b.y+s*.24,s*.11); c.fill(); }
  for(const p of parts){ if(p.pop>0) p.pop=Math.max(0,p.pop-dt*3);
    if(p.t==='motor'||p.t==='fan') p.ang+=(p.on?clamp(p.lvl,0,2)*14:0)*dt;
    if(Math.abs(p.I)>.04&&!(p.t==='switch'&&!p.sw)) p.ph+=Math.sign(p.I)*clamp(Math.abs(p.I)*1.1,.35,4)*dt; }
  const wires=parts.filter(p=>p.t==='wire'), others=parts.filter(p=>p.t!=='wire');
  for(const p of wires){ const [A,B]=epts(p.e); drawWire(c,A,B,s,p); }
  for(const p of others){ const [A,B]=epts(p.e); drawLead(c,A,B,s); }
  const used=new Set(); for(const p of parts){ const E=EBY[p.e]; used.add(E.a); used.add(E.b); }
  for(let n=0;n<NX*NY;n++){ const q=npos(n), u=used.has(n);
    c.fillStyle=u?'#ffd54f':'#90a4ae'; c.strokeStyle='#0a0e16'; c.lineWidth=s*.025; circ(c,q.x,q.y,s*(u?.085:.065)); c.fill(); c.stroke(); }
  if(BD&&BD.kind==='wire'){ const q=npos(BD.last); c.strokeStyle='#69f0ae'; c.lineWidth=s*.04; circ(c,q.x,q.y,s*.16+Math.sin(T*8)*s*.02); c.stroke(); }
  if(!night) drawElectrons(c,s);
  for(const p of others){ const [A,B]=epts(p.e); drawBody(c,p,A,B,s,T); }
  if(night){ c.fillStyle='rgba(0,0,10,.45)'; c.fillRect(0,0,w,h); drawElectrons(c,s); }
  c.globalCompositeOperation='lighter';
  for(const p of others){ const [A,B]=epts(p.e); drawGlow(c,p,A,B,s,T,night); }
  c.globalCompositeOperation='source-over';
  if(night) for(const p of others) if(p.on&&(p.t==='bulb'||p.t==='led'||p.t==='robot')){ const [A,B]=epts(p.e); drawBody(c,p,A,B,s,T); }
  if(hintT>0&&MODE==='mission'){ hintT-=dt; c.globalAlpha=.35+.25*Math.sin(T*6);
    for(const q of MISSIONS[MI].sol){ const ex=partAt(q.e); if(ex&&ex.t===q.t&&(q.t!=='battery'||ex.dir===q.dir)) continue; const [A,B]=epts(q.e); drawFull(c,mkPart(q.t,q.e,q.dir,q.sw),A,B,s,T); }
    c.globalAlpha=1; }
  if(DRAG&&DRAG.moved&&DRAG.target){
    const [A,B]=epts(DRAG.target.key); c.globalAlpha=.7; const gp=DRAG.part||mkPart(DRAG.t,DRAG.target.key); drawFull(c,gp,A,B,s,T); c.globalAlpha=1;
    c.strokeStyle='#69f0ae'; c.lineWidth=s*.04; c.setLineDash([s*.08,s*.06]); const mx=(A.x+B.x)/2,my=(A.y+B.y)/2; circ(c,mx,my,s*.42); c.stroke(); c.setLineDash([]);
  }
  if(parts.some(p=>p.t==='buzzer'&&p.on)){ buzzT-=dt; if(buzzT<=0){ buzzT=.42; buzzK^=1; sfx.buzz(buzzK); } }
  if(parts.some(p=>p.t==='robot'&&p.on)){ robotT-=dt; if(robotT<=0){ robotT=rnd(2.5,4); sfx.boop(); } }
  if(doneT>0){ doneT-=dt; if(doneT<=0) showDone(); }
}
function drawElectrons(c,s){
  for(const p of parts){
    if(Math.abs(p.I)<.04||(p.t==='switch'&&!p.sw)) continue;
    const [A,B]=epts(p.e), red=p.short;
    for(let i=0;i<2;i++){ const f=((p.ph+i/2)%1+1)%1, x=A.x+(B.x-A.x)*f, y=A.y+(B.y-A.y)*f;
      c.fillStyle=red?'rgba(255,90,70,.35)':'rgba(255,240,120,.35)'; circ(c,x,y,s*.085); c.fill();
      c.fillStyle=red?'#ffccbc':'#fffde7'; circ(c,x,y,s*.042); c.fill(); }
  }
}
