<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14202e">
<title>Robot Workshop</title>
<style>
:root{--bg:#14202e;--panel:#1d2c3e;--panel2:#24374d;--line:#ffffff1f;--text:#f2f8ff;--dim:#9fb3c8;--accent:#ffcc33}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,Arial,sans-serif}
body{height:100dvh;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0}
#app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr);gap:6px;
  padding:max(6px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
#hud{display:flex;align-items:center;gap:8px;padding:4px 8px;background:linear-gradient(#2a4060,#1b2b40);border:1px solid var(--line);border-radius:12px}
.hb{width:40px;height:40px;border-radius:11px;background:#0f1a28;border:1px solid var(--line);font-size:19px;flex:none;display:grid;place-items:center}
.brand{font-weight:900;letter-spacing:1px;font-size:15px;color:var(--accent);white-space:nowrap}
.brand small{color:var(--dim);font-size:9px;letter-spacing:.5px}
#title{flex:1;min-width:0;text-align:center;font-weight:900;font-size:15px;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#main{min-height:0;min-width:0;display:grid;gap:6px}
#main.split{grid-template-columns:minmax(0,1fr) clamp(270px,34vw,400px)}
#main.full,#main.garage{grid-template-columns:minmax(0,1fr)}
#main.garage #stageWrap,#main.garage #panel,#main.full #panel{display:none}
#main:not(.garage) #garage{display:none}
#stageWrap{position:relative;min-height:0;min-width:0;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#22344a}
#cv{display:block;width:100%;height:100%;touch-action:none}
#jumpBtn{position:absolute;right:max(12px,2vw);bottom:max(12px,3vh);width:clamp(96px,24vh,150px);height:clamp(96px,24vh,150px);border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#fff3a6,#ffcc33 55%,#e09a00);color:#3a2600;font-weight:900;font-size:clamp(17px,3.6vh,26px);letter-spacing:1px;
  box-shadow:0 6px 0 #a86f00,0 10px 22px #0007;display:none;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;touch-action:none}
#jumpBtn b{font-size:1.5em}
#jumpBtn.down{transform:translateY(4px);box-shadow:0 2px 0 #a86f00,0 6px 14px #0007}
#main.full #jumpBtn{display:flex}
#panel{min-height:0;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:7px;overflow:hidden}
#garage{min-height:0;overflow-y:auto;touch-action:pan-y;display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(140px,19vw,190px),1fr));gap:10px;align-content:start;padding:4px;scrollbar-width:none}
#garage::-webkit-scrollbar{display:none}
.gcard{position:relative;background:linear-gradient(#2d4562,#22364e);border:3px solid #ffffff18;border-radius:18px;padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.gcard:active{transform:scale(.97)}
.gcard canvas{width:100%;aspect-ratio:220/200;pointer-events:none}
.gname{font-weight:900;font-size:clamp(13px,2.4vh,16px);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.gst{font-size:14px;color:var(--accent);min-height:18px;font-weight:900}
.hurt{color:#ffb15c;font-size:13px;margin-left:4px}
.newcard{background:linear-gradient(#5ff29a,#1f9e57);color:#06210f;justify-content:center;min-height:clamp(170px,30vh,240px);text-align:center;font-size:clamp(15px,2.8vh,19px);border-color:#ffffff55}
.plus{font-size:clamp(54px,11vh,80px);font-weight:900;line-height:1}
.btn{border-radius:14px;padding:8px 10px;font-weight:900;font-size:clamp(14px,2.7vh,19px);letter-spacing:.5px;color:#fff;box-shadow:inset 0 -4px 0 #0003;
  display:flex;align-items:center;justify-content:center;gap:8px;min-height:clamp(46px,9vh,62px);text-shadow:0 1px 2px #0005;flex:none}
.btn:active{transform:translateY(2px)}
.btn.go{background:linear-gradient(#5ff29a,#22b866);color:#062612;text-shadow:none}
.btn.orange{background:linear-gradient(#ffb15c,#f07c1f);color:#2b1400;text-shadow:none}
.btn.blue{background:linear-gradient(#69c3ff,#2a86e0)}
.btn.purple{background:linear-gradient(#c38bff,#8a4fe0)}
.btn.red{background:linear-gradient(#ff8a7a,#c8392f)}
.btn.ghost{background:#2b3f57;color:var(--dim);min-height:36px;font-size:13px;box-shadow:none}
.btn.shiny{background:#2b3f57;color:#9fe6b8;text-shadow:none}
.btn .cnt{background:#0005;color:#fff;border-radius:9px;padding:0 8px;font-size:.85em}
.vname{font-weight:900;font-size:clamp(18px,3.6vh,26px);color:var(--accent);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vsub{text-align:center;font-weight:800;color:var(--dim);font-size:13px;margin-top:-4px}
.vbtns{flex:1;min-height:0;display:flex;flex-direction:column;gap:7px;justify-content:center}
.nameRow{display:flex;align-items:center;gap:6px}
.rname{flex:1;min-width:0;font-weight:900;font-size:clamp(15px,3vh,21px);color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.tab{border-radius:10px;background:#0f1a28;padding:4px 0;font-size:clamp(8.5px,1.6vh,11px);font-weight:900;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:1px}
.tab .ti{font-size:clamp(16px,3.2vh,23px);line-height:1}
.tab.on{background:var(--accent);color:#2a1d00}
.opts{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:5px}
.opts.paint{grid-template-columns:repeat(5,minmax(0,1fr))}
.opt{border-radius:12px;background:#0f1a28;border:3px solid transparent;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;min-width:0;overflow:hidden}
.opt canvas{width:100%;flex:1;min-height:0;object-fit:contain;pointer-events:none}
.opt span{font-size:clamp(9px,1.6vh,11px);font-weight:900;color:var(--dim);white-space:nowrap}
.opt.on{border-color:var(--accent);background:#3a3210}
.sw{border-radius:50%;width:78%;aspect-ratio:1;max-height:90%;border:3px solid #ffffff44;box-shadow:inset 0 -6px 0 #0003}
.wrow{display:grid;grid-template-columns:1fr 1.6fr;gap:6px}
.ptitle{font-weight:900;color:var(--dim);font-size:12px;letter-spacing:1px;text-align:center}
.tools{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:7px}
.tool{border-radius:16px;background:#0f1a28;border:4px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;padding:4px}
.tool canvas{width:80%;flex:1;min-height:0;object-fit:contain;pointer-events:none}
.tool span{font-size:clamp(10px,1.8vh,13px);font-weight:900;color:var(--dim)}
.tool.on{border-color:var(--accent);background:#3a3210}
.tool.hint{animation:wig .45s 3}
@keyframes wig{25%{transform:rotate(-7deg) scale(1.06)}75%{transform:rotate(7deg) scale(1.06)}}
.left{text-align:center;font-weight:900;font-size:clamp(14px,2.6vh,18px);color:#ffb15c}
.left.ok{color:#5ff29a}
.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:8px;background:#08101acc;backdrop-filter:blur(3px)}
.overlay.hidden{display:none}
.card{width:min(520px,100%);max-height:calc(100dvh - 16px);overflow:auto;padding:14px 16px;text-align:center;background:linear-gradient(#2a4262,#18273a);
  border:1px solid #ffffff2a;border-radius:20px;box-shadow:0 24px 70px #000c;display:flex;flex-direction:column;gap:8px}
.card h1{margin:0;font-size:clamp(20px,4.4vw,30px);letter-spacing:1px;color:var(--accent)}
.rstars{font-size:clamp(40px,10vh,64px);line-height:1;letter-spacing:4px}
.rstars span{display:inline-block;color:#ffcc33;text-shadow:0 3px 0 #a86f00;animation:pop .45s backwards}
.rstars span.e{color:#ffffff22;text-shadow:none}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.rstats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.rstats div{background:#0f1a28;border-radius:12px;padding:5px 10px;font-weight:900;font-size:15px}
.stamp{align-self:center;border:4px solid #5ff29a;color:#5ff29a;border-radius:12px;padding:4px 14px;font-weight:900;font-size:clamp(18px,4vh,26px);letter-spacing:2px;transform:rotate(-6deg);animation:stamp .5s .9s backwards}
@keyframes stamp{0%{transform:scale(3) rotate(-6deg);opacity:0}100%{transform:scale(1) rotate(-6deg);opacity:1}}
.rmsg{font-weight:800;color:var(--dim);font-size:14px}
.ver{font-size:10px;color:var(--dim);font-weight:800;opacity:.7}
@media (orientation:landscape) and (max-height:500px){
  .card{padding:8px 12px;gap:5px}.rmsg{font-size:12px}
}
@media (orientation:portrait){
  .brand{display:none}
  #main.split{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  #main.split #panel{height:min(48dvh,440px)}
  .tools{grid-template-columns:repeat(4,minmax(0,1fr))}
  #main.split #panel.rp{height:auto}
  #panel.rp .tools{flex:none;grid-auto-rows:clamp(84px,15vh,130px)}
}
</style>
</head>
<body>
<main id="app">
  <header id="hud">
    <button class="hb" id="homeBtn" type="button" aria-label="Garage">🏠</button>
    <div class="brand">ROBOT WORKSHOP <small>v1</small></div>
    <div id="title">MY ROBOT GARAGE</div>
    <button class="hb" id="muteBtn" type="button" aria-label="Sound on or off">🔊</button>
  </header>
  <section id="main" class="garage">
    <div id="garage"></div>
    <div id="stageWrap"><canvas id="cv"></canvas><div id="jumpBtn"><b>⬆</b><span id="jumpLbl">JUMP</span></div></div>
    <aside id="panel"></aside>
  </section>
</main>

<div class="overlay hidden" id="report">
  <div class="card">
    <h1>📋 TEST REPORT</h1>
    <div class="vname" id="repName"></div>
    <div class="rstars" id="repStars"></div>
    <div class="stamp" id="repStamp">CERTIFIED!</div>
    <div class="rstats" id="repStats"></div>
    <div class="rmsg" id="repMsg"></div>
    <button class="btn orange" id="repFix" type="button">🔧 FIX IT!</button>
    <button class="btn go" id="repAgain" type="button">▶ RUN AGAIN</button>
    <button class="btn ghost" id="repDone" type="button">DONE</button>
  </div>
</div>

<div class="overlay hidden" id="confirm">
  <div class="card">
    <h1 style="color:#ff8a7a">♻️ RECYCLE ROBOT?</h1>
    <div class="rmsg" id="cfMsg" style="font-size:15px;color:#fff"></div>
    <button class="btn go" id="cfNo" type="button">KEEP MY ROBOT</button>
    <button class="btn red" id="cfYes" type="button">YES, RECYCLE IT</button>
  </div>
</div>

<script>
'use strict';
(function(){
/* ============================================================
   NO LONG-PRESS MENUS / ZOOM
   ============================================================ */
['contextmenu','selectstart','dragstart','gesturestart'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
let lastTE=0;
document.addEventListener('touchend',e=>{ const n=Date.now(); if(n-lastTE<350&&e.target.closest('button,canvas,.gcard,.opt,.tool,.tab,#jumpBtn')) e.preventDefault(); lastTE=n; },{passive:false});

const $=id=>document.getElementById(id);
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
function onTap(el,fn){
  let d=null;
  el.addEventListener('pointerdown',e=>{ if(e.pointerType==='mouse'&&e.button!==0) return; d={x:e.clientX,y:e.clientY,id:e.pointerId}; });
  el.addEventListener('pointerup',e=>{ if(!d||d.id!==e.pointerId) return; const m=Math.hypot(e.clientX-d.x,e.clientY-d.y); d=null; if(m<16){ initAudio(); fn(e); } });
  el.addEventListener('pointercancel',()=>d=null);
}
function shade(hex,a){
  const n=parseInt(hex.slice(1),16); let r=n>>16,g=n>>8&255,b=n&255;
  if(a<0){ r*=1+a; g*=1+a; b*=1+a; } else { r+=(255-r)*a; g+=(255-g)*a; b+=(255-b)*a; }
  return 'rgb('+(r|0)+','+(g|0)+','+(b|0)+')';
}
function rr(c,x,y,w,h,r){ r=Math.min(r,w/2,h/2); c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function circ(c,x,y,r){ c.beginPath(); c.arc(x,y,r,0,TAU); }
function FS(c,col){ c.fillStyle=col; c.fill(); c.stroke(); }
const OUT='rgba(15,20,30,.55)';
function SR(c){ c.strokeStyle=OUT; c.lineWidth=2.4; }
function dbl(c,col,w){ c.strokeStyle='rgba(15,20,30,.6)'; c.lineWidth=w+4; c.stroke(); c.strokeStyle=col; c.lineWidth=w; c.stroke(); SR(c); }
function star(c,x,y,r1,r2,rot){ c.beginPath(); for(let i=0;i<10;i++){ const a=-Math.PI/2+(rot||0)+i*Math.PI/5, r=i%2?r2:r1; c.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r); } c.closePath(); }

/* ============================================================
   SOUND — friendly tones only (no static / no voice)
   ============================================================ */
let AC=null, master=null, muted=false;
function initAudio(){
  if(AC){ AC.resume&&AC.resume(); return; }
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=.5; master.connect(AC.destination); }catch(e){ AC=null; }
}
function tone(f,d,type,vol,delay,slide){
  if(!AC||muted) return;
  const t0=AC.currentTime+(delay||0), o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t0); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t0+d);
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol||.2,t0+.01); g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0+d+.05);
}
const sfx={
  click:()=>tone(900,.05,'square',.04),
  clank:()=>{ tone(320,.09,'square',.05); tone(470,.14,'triangle',.08,.02); },
  beep:()=>{ tone(880,.09,'square',.05); tone(660,.09,'square',.05,.1); tone(990,.14,'square',.05,.2); },
  power:()=>{ tone(120,1,'sawtooth',.04,0,900); tone(240,1,'triangle',.08,0,1800); },
  boop:()=>[523,784,659,1047].forEach((f,i)=>tone(f,.13,'square',.05,i*.11)),
  jump:()=>tone(380,.16,'sine',.16,0,820),
  boing:()=>{ tone(200,.3,'triangle',.18,0,700); tone(700,.2,'sine',.07,.12,300); },
  star:k=>{ const f=660*Math.pow(1.06,Math.min(k,14)); tone(f,.12,'triangle',.12); tone(f*1.5,.12,'sine',.05,.05); },
  bolt:()=>tone(1800,.05,'triangle',.07),
  bonk:()=>{ tone(160,.15,'square',.08,0,90); tone(520,.07,'triangle',.06); },
  splat:()=>tone(320,.22,'sine',.18,0,70),
  land:()=>tone(150,.07,'sine',.12),
  hammer:()=>{ tone(240,.06,'square',.07); tone(1250,.06,'triangle',.06,.01); },
  screw:()=>tone(500,.15,'square',.045,0,1100),
  wrench:()=>{ tone(380,.05,'triangle',.1); tone(300,.05,'triangle',.1,.07); },
  squeak:()=>tone(rnd(1200,1500),.06,'sine',.05,0,1700),
  fixed:()=>[784,988,1319].forEach((f,i)=>tone(f,.14,'triangle',.12,i*.07)),
  allfixed:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.2,'triangle',.14,i*.1)),
  nope:()=>{ tone(260,.12,'triangle',.12); tone(200,.14,'triangle',.1,.1); },
  go:()=>{ tone(660,.15,'square',.06); tone(990,.3,'square',.06,.18); },
  fanfare:()=>{ [523,659,784,1047].forEach((f,i)=>tone(f,.28,'triangle',.18,i*.13)); tone(1047,.8,'triangle',.16,.55); tone(1319,.8,'triangle',.1,.55); },
  dance:()=>{ const n=[523,659,784,659,587,698,880,698,523,659,784,1047]; n.forEach((f,i)=>{ tone(f,.16,'square',.04,i*.2); if(i%2===0) tone(f/2,.18,'triangle',.08,i*.2); }); }
};

/* ============================================================
   ROBOT PARTS
   ============================================================ */
const PARTS={
  head:[{k:'box',n:'Box'},{k:'dome',n:'Bubble'},{k:'tv',n:'TV'},{k:'teapot',n:'Teapot'},{k:'cyclops',n:'One Eye'}],
  body:[{k:'box',n:'Box'},{k:'barrel',n:'Barrel'},{k:'trash',n:'Trash Can'},{k:'rocket',n:'Rocket'},{k:'gumball',n:'Gumball'}],
  arms:[{k:'claws',n:'Claws'},{k:'hands',n:'Hands'},{k:'drill',n:'Drills'},{k:'boxer',n:'Boxing'},{k:'magnet',n:'Magnets'}],
  legs:[{k:'wheels',n:'Wheels'},{k:'treads',n:'Treads'},{k:'walker',n:'Legs'},{k:'spring',n:'Spring'},{k:'jet',n:'Jet'}],
  extra:[{k:'none',n:'None'},{k:'jetpack',n:'Jetpack'},{k:'propeller',n:'Propeller'},{k:'siren',n:'Siren'},{k:'flag',n:'Flag'}]
};
const COLORS=['#e53935','#fb8c00','#fdd835','#43a047','#00acc1','#1e88e5','#5e35b1','#ec407a','#9aa7b3','#c9a227'];
const TABS=[{k:'head',n:'HEAD',i:'🤖'},{k:'body',n:'BODY',i:'🛢️'},{k:'arms',n:'ARMS',i:'🦾'},{k:'legs',n:'LEGS',i:'🦿'},{k:'extra',n:'EXTRA',i:'🚀'},{k:'color',n:'PAINT',i:'🎨'}];
const N1=['Bolt','Sprocket','Gizmo','Zippy','Clank','Beep','Rusty','Sparky','Widget','Turbo','Gadget','Boop','Chip','Rivet','Dynamo','Whirly','Buzz','Tinker','Cog','Zap'];
const N2=['-o','-bot','-tron','-zoid',' 3000',' Jr.',' Max','-inator','-matic',''];
function makeName(){ const n=pick(N1)+pick(N2); return Math.random()<.18?'Captain '+n:n; }
function randomRobot(){
  return {id:Date.now()+Math.floor(Math.random()*999),name:makeName(),head:pick(PARTS.head).k,body:pick(PARTS.body).k,arms:pick(PARTS.arms).k,
    legs:pick(PARTS.legs).k,extra:Math.random()<.4?'none':pick(PARTS.extra).k,color:pick(COLORS),damage:[],best:0,runs:0};
}
const HEADTOP={box:-76,dome:-54,tv:-78,teapot:-64,cyclops:-58};

/* ============================================================
   DRAW A ROBOT  (origin = ground under its feet, 1 unit ≈ 1px at s=1)
   ============================================================ */
function eyes(c,o,pts,r,lid){
  const pw=o.power==null?1:o.power;
  for(const [x,y] of pts){
    if(pw<.5){ c.fillStyle='#46505c'; circ(c,x,y,r); c.fill(); c.stroke(); continue; }
    if(o.happy){ c.save(); c.strokeStyle='#1d2430'; c.lineWidth=r*.42; c.beginPath(); c.arc(x,y+r*.35,r*.7,Math.PI*1.15,Math.PI*1.85); c.stroke(); c.restore(); continue; }
    if(o.blink){ c.save(); c.strokeStyle='#1d2430'; c.lineWidth=r*.35; c.beginPath(); c.moveTo(x-r*.8,y); c.lineTo(x+r*.8,y); c.stroke(); c.restore(); continue; }
    c.fillStyle='#fff'; circ(c,x,y,r); c.fill(); c.stroke();
    const lx=clamp(o.look||0,-1,1)*r*.35;
    c.fillStyle='#1d2430'; circ(c,x+lx,y+r*.12,r*.5); c.fill();
    c.fillStyle='#fff'; circ(c,x+lx-r*.17,y-r*.08,r*.17); c.fill();
    if(o.sad){ const sg=x<0?-1:1; c.fillStyle=lid; c.beginPath(); c.moveTo(x-r-1.5,y-r-2); c.lineTo(x+r+1.5,y-r-2);
      c.lineTo(x+r+1.5,y-r*(sg<0?.75:.05)); c.lineTo(x-r-1.5,y-r*(sg<0?.05:.75)); c.closePath(); c.fill(); }
  }
}
function drawRobot(c,R,o){
  o=o||{};

    TOOLS.map(tl=>'<button class="tool" type="button" data-k="'+tl.k+'"><canvas width="110" height="110"></canvas><span>'+tl.n+'</span></button>').join('')+
    '</div><div class="left" id="leftN"></div><div id="doneBtns" style="display:none;flex-direction:column;gap:6px"><button class="btn go" id="fdRun" type="button">▶ TEST RUN</button><button class="btn ghost" id="fdDone" type="button">DONE</button></div>';
  panel.querySelectorAll('.tool').forEach(b=>{ const cn=b.querySelector('canvas'), c=cn.getContext('2d'); drawTool(c,b.dataset.k,55,58,1.45,b.dataset.k==='sponge'?0:-.5);
    onTap(b,()=>{ tool=b.dataset.k; sfx.click(); syncTools(); }); });
  onTap($('fdRun'),()=>openRun(cur)); onTap($('fdDone'),()=>openView(cur));
  syncTools();
}
function syncTools(){
  panel.querySelectorAll('.tool').forEach(b=>b.classList.toggle('on',b.dataset.k===tool));
  const n=cur.damage.length, el=$('leftN');
  if(!el) return;
  el.textContent=n?n+' thing'+(n>1?'s':'')+' to fix':'🎉 ALL FIXED!'; el.className='left'+(n?'':' ok');
  $('doneBtns').style.display=n?'none':'flex';
}
function hintTool(k){ const b=panel.querySelector('.tool[data-k="'+k+'"]'); if(!b) return; b.classList.remove('hint'); void b.offsetWidth; b.classList.add('hint'); }
function spotAt(px,py){
  const g=geom(.8); let best=null, bd=1e9;
  for(const d of cur.damage){ const sx=g.x+d.x*g.s, sy=g.y+d.y*g.s, rad=Math.max(30*g.s,28*DPR), dd=Math.hypot(px-sx,py-sy); if(dd<rad&&dd<bd){ bd=dd; best=d; } }
  return best;
}
function repairHit(d,amt){
  const g=geom(.8);
  d.prog=Math.min(1,(d.prog||0)+amt);
  if(d.type==='screw') d.spin=(d.spin||0)+1.6;
  ST.anims.push({tool:TOOLFOR[d.type],x:d.x,y:d.y,t:0});
  const sx=g.x+d.x*g.s, sy=g.y+d.y*g.s;
  if(d.type==='mud') FX.push({x:sx+rnd(-14,14)*DPR,y:sy,vx:rnd(-30,30)*DPR,vy:-80*DPR,life:.8,r:rnd(4,8)*DPR,col:'#ffffffcc',puff:true});
  else if(d.type==='spark') sparkle(sx,sy,4,'#ffd740',.6);
  if(d.prog>=.999){
    cur.damage=cur.damage.filter(x=>x!==d); save(); sfx.fixed(); sparkle(sx,sy,14);
    FX.push({x:sx,y:sy-30*DPR,vx:0,vy:-50*DPR,life:1.2,txt:'FIXED!',col:'#5ff29a',big:true});
    syncTools();
    if(!cur.damage.length){ ST.done=true; ST.doneT=0; sfx.allfixed(); confetti(90); ST.bubble={text:'Thank you! I feel GREAT!',t:3}; }
  }
}
function repairDown(px,py){
  const d=spotAt(px,py); if(!d){ ST.sq=.3; sfx.click(); return; }
  const need=TOOLFOR[d.type];
  if(tool!==need){ hintTool(need); sfx.nope(); ST.hint={d,t:1}; return; }
  if(d.type==='mud'){ ST.rub={d,x:px,y:py,acc:0}; repairHit(d,1/NEED.mud); sfx.squeak(); return; }
  ({hammer:sfx.hammer,screwdriver:sfx.screw,wrench:sfx.wrench})[tool]();
  repairHit(d,1/NEED[d.type]);
}
function repairMove(px,py){
  const rb=ST.rub; if(!rb||tool!=='sponge'||!cur.damage.includes(rb.d)) return;
  const dist=Math.hypot(px-rb.x,py-rb.y); rb.x=px; rb.y=py; rb.acc+=dist;
  const step=55*DPR; if(rb.acc>step){ rb.acc-=step; if(spotAt(px,py)===rb.d||Math.hypot(px-(geom(.8).x+rb.d.x*geom(.8).s),py-(geom(.8).y+rb.d.y*geom(.8).s))<70*DPR){ repairHit(rb.d,.13); sfx.squeak(); } }
}
function drawRepair(dt){
  const g=geom(.8); ST.t+=dt; drawShop(g.w,g.h,ST.t);
  if(ST.done) ST.doneT+=dt;
  const dn=ST.done&&ST.doneT<3.2?1:0;
  drawRobot(cx,cur,{x:g.x,y:g.y,s:g.s,t:ST.t,damage:cur.damage,sad:cur.damage.length>0,happy:ST.done,dance:dn,phase:ST.t*8,look:Math.sin(ST.t*.6)*.7});
  if(ST.done&&ST.doneT<1.2){ const k=ST.doneT/1.2; cx.save(); cx.globalAlpha=.5*(1-k); const xx=g.x+(-130+260*k)*g.s; const gr=cx.createLinearGradient(xx-30*g.s,0,xx+30*g.s,0); gr.addColorStop(0,'rgba(255,255,255,0)'); gr.addColorStop(.5,'#fff'); gr.addColorStop(1,'rgba(255,255,255,0)'); cx.fillStyle=gr; cx.fillRect(xx-30*g.s,g.y-260*g.s,60*g.s,260*g.s); cx.restore(); }
  const u=U();
  for(const d of cur.damage){
    const sx=g.x+d.x*g.s, sy=g.y+d.y*g.s, hinted=ST.hint&&ST.hint.d===d&&ST.hint.t>0;
    const pulse=1+Math.sin(ST.t*5+d.x)*.06+(hinted?Math.sin(ST.t*20)*.15:0);
    const bx=sx+(d.x<0?-34:34)*u, by=sy-30*u, br=20*u*pulse;
    cx.strokeStyle='#ffffffaa'; cx.lineWidth=2*u; cx.setLineDash([4*u,4*u]); cx.beginPath(); cx.moveTo(sx,sy); cx.lineTo(bx,by); cx.stroke(); cx.setLineDash([]);
    cx.fillStyle=hinted?'#ffd740':'#ffffffee'; circ(cx,bx,by,br); cx.fill(); cx.strokeStyle='#0004'; cx.stroke();
    drawTool(cx,TOOLFOR[d.type],bx,by+2*u,.5*u*pulse,d.type==='mud'?0:-.6);
    if(d.prog>0){ cx.strokeStyle='#5ff29a'; cx.lineWidth=4*u; cx.beginPath(); cx.arc(bx,by,br+4*u,-Math.PI/2,-Math.PI/2+TAU*d.prog); cx.stroke(); }
  }
  if(ST.hint){ ST.hint.t-=dt; if(ST.hint.t<=0) ST.hint=null; }
  for(const a of ST.anims){ a.t+=dt; const k=a.t/.3, sx=g.x+a.x*g.s, sy=g.y+a.y*g.s, ts=g.s*1.1;
    let rot=0, ox=0, oy=0;
    if(a.tool==='hammer'){ rot=-1.2+Math.sin(k*Math.PI)*1.1; ox=18*g.s; oy=-6*g.s; }
    else if(a.tool==='screwdriver'){ rot=-.6; ox=10*g.s; oy=18*g.s; }
    else if(a.tool==='wrench'){ rot=-.4+Math.sin(k*TAU)*.6; ox=14*g.s; oy=14*g.s; }
    else { ox=Math.sin(k*TAU*2)*10*g.s; }
    cx.globalAlpha=clamp(2-k*2,0,1); drawTool(cx,a.tool,sx+ox,sy+oy,ts,rot); cx.globalAlpha=1; }
  ST.anims=ST.anims.filter(a=>a.t<.3);
  drawFX(dt); drawBubble(g,dt);
}

/* ============================================================
   INPUT ON THE STAGE
   ============================================================ */
function evPos(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*(cv.width/r.width),(e.clientY-r.top)*(cv.height/r.height)]; }
cv.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0) return; e.preventDefault(); initAudio();
  const [px,py]=evPos(e);
  if(SCREEN==='run') runDown();
  else if(SCREEN==='repair') repairDown(px,py);
  else if(SCREEN==='view'){ ST.jump=.5; sfx.beep(); ST.bubble={text:pick(['BEEP BOOP!','Hi friend!','Zoom zoom!','I\'m '+cur.name+'!','Let\'s go!','Wheee!','Bleep bloop!']),t:1.8}; sparkle(px,py,6); }
  else if(SCREEN==='workshop'&&ST.power<0){ ST.pop=1; sfx.beep(); sparkle(px,py,6); }
},{passive:false});
cv.addEventListener('pointermove',e=>{ if(SCREEN==='repair'&&ST.rub){ const [px,py]=evPos(e); repairMove(px,py); } });
['pointerup','pointercancel','pointerleave'].forEach(ev=>cv.addEventListener(ev,()=>{ runUp(); if(ST) ST.rub=null; }));

/* ============================================================
   TOP BAR & LOOP
   ============================================================ */
onTap($('homeBtn'),()=>{ panel.style.pointerEvents=''; $('report').classList.add('hidden'); RUN=null; save(); showGarage(); });
onTap($('muteBtn'),()=>{ muted=!muted; $('muteBtn').textContent=muted?'🔇':'🔊'; });
let last=performance.now();
function frame(now){
  const dt=Math.max(0,Math.min(.05,(now-last)/1000)); last=now;
  if(SCREEN!=='garage'){
    sizeCanvas(); cx.setTransform(1,0,0,1,0,0);
    if(SCREEN==='view') drawView(dt);
    else if(SCREEN==='workshop') drawWorkshop(dt);
    else if(SCREEN==='run'&&RUN) drawRun(dt);
    else if(SCREEN==='repair') drawRepair(dt);
  }
  requestAnimationFrame(frame);
}
showGarage();
requestAnimationFrame(frame);
window.__RW={get robots(){return robots},get RUN(){return RUN},get SCREEN(){return SCREEN},openRun,openRepair,openView,openWorkshop,addDamage,get cur(){return cur}};
})();
</script>
