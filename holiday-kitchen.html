<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2a160c">
<title>Holiday Kitchen</title>
<style>
:root{--wall1:#f4dcb8;--wall2:#e7c08e;--cloth:#c0392b;--cloth2:#a93226;--accent:#e67e22;--accent2:#ffd27a;--ink:#3a2210;--face:60px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#2a160c;color:var(--ink);font-family:"Segoe UI",system-ui,Arial,sans-serif}
body{height:100dvh;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0}
button *{pointer-events:none}
.emo{font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;line-height:1}
#app{height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:6px;
  padding:max(6px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
#hud{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:12px;background:linear-gradient(#ffffff22,#ffffff0a);border:1px solid #ffffff22;color:#fff}
.hb{width:40px;height:40px;border-radius:11px;background:#00000040;border:1px solid #ffffff2a;font-size:19px;flex:none;display:grid;place-items:center;color:#fff}
.brand{font-weight:900;letter-spacing:1px;font-size:14px;color:var(--accent2);white-space:nowrap}
.brand small{color:#ffffffaa;font-size:9px}
#say{flex:1;min-width:0;text-align:center;font-weight:900;font-size:clamp(13px,2.6vh,20px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stars{font-weight:900;font-size:clamp(14px,2.6vh,19px);white-space:nowrap;background:#00000040;border-radius:10px;padding:4px 10px}
#room{min-height:0;display:grid;gap:6px;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
#dining{position:relative;min-height:0;border-radius:16px;overflow:hidden;background:linear-gradient(var(--wall1),var(--wall2));border:3px solid #00000030}
#banner{position:absolute;left:50%;top:6px;transform:translateX(-50%);padding:4px 16px;border-radius:12px;background:var(--accent);color:#fff;font-weight:900;
  font-size:clamp(11px,2.4vh,18px);letter-spacing:1px;white-space:nowrap;box-shadow:0 3px 0 #0003;z-index:2}
#decor{position:absolute;inset:0;pointer-events:none}
#decor span{position:absolute;opacity:.9}
#table{position:absolute;left:-2%;right:-2%;bottom:0;height:30%;background:linear-gradient(var(--cloth),var(--cloth2));border-top:6px solid #ffffff55}
#table::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,#ffffff12 0 22px,transparent 22px 44px)}
#guests{position:absolute;left:0;right:0;bottom:4%;display:flex;justify-content:space-evenly;align-items:flex-end;z-index:3}
.guest{position:relative;display:flex;flex-direction:column;align-items:center;cursor:pointer;touch-action:manipulation}
.guest *{pointer-events:none}
.bub{background:#fff;border-radius:16px;padding:4px 7px;display:flex;gap:4px;box-shadow:0 3px 0 #0002;position:relative;margin-bottom:6px;min-height:calc(var(--face)*.62)}
.bub::after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);border:8px solid transparent;border-top-color:#fff;border-bottom:0}
.wish{position:relative;font-size:calc(var(--face)*.5);transition:opacity .3s}
.wish.done{opacity:.35}
.wish.done::after{content:"✔";position:absolute;right:-4px;bottom:-4px;font-size:.55em;color:#fff;background:#2ecc71;border-radius:50%;width:1.2em;height:1.2em;display:grid;place-items:center;font-weight:900}
.face{font-size:var(--face);position:relative;transition:transform .2s}
.hat{position:absolute;left:50%;top:-.42em;transform:translateX(-50%);font-size:.55em}
.nm{font-size:clamp(9px,1.7vh,12px);font-weight:900;color:#fff;background:#0006;border-radius:8px;padding:1px 7px;margin-top:2px;white-space:nowrap}
.plate{width:calc(var(--face)*1.15);height:calc(var(--face)*.42);margin-top:4px;border-radius:50%;background:radial-gradient(#fff 55%,#e8e8e8 56%,#fff 70%);
  box-shadow:0 3px 0 #0002;display:grid;place-items:center;font-size:calc(var(--face)*.42)}
.plate span{transform:translateY(-22%);transition:transform .3s,opacity .5s}
.guest.munch .face{animation:munch .25s 5}
@keyframes munch{50%{transform:scale(1.12,.9)}}
.guest.giggle .face{animation:giggle .4s 2}
@keyframes giggle{25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
.guest.happy .bub{background:#ffe3ec}
.heart{position:absolute;font-size:calc(var(--face)*.4);animation:heart 1.4s forwards;pointer-events:none}
@keyframes heart{0%{transform:translateY(0) scale(.4);opacity:0}20%{opacity:1;transform:translateY(-10px) scale(1)}100%{transform:translateY(-70px) scale(1.1);opacity:0}}
.talk{position:absolute;top:-1.6em;left:50%;transform:translateX(-50%);background:#fff;border-radius:10px;padding:3px 8px;font-weight:900;font-size:clamp(10px,2vh,14px);white-space:nowrap;
  box-shadow:0 2px 0 #0002;animation:talk 1.8s forwards;z-index:5}
@keyframes talk{0%{opacity:0;transform:translate(-50%,6px)}12%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0}}
.fall{position:absolute;top:-40px;pointer-events:none;animation:fall linear forwards;z-index:1}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
#kitchen{min-height:0;min-width:0;border-radius:16px;background:linear-gradient(#fff8ee,#f3e6d2);border:3px solid #00000030;padding:8px;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:8px}
#recipe{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:6px 10px;box-shadow:0 3px 0 #0001;min-height:0}
#recipe .rd{font-size:clamp(28px,7vh,48px)}
#recipe .rt{flex:1;min-width:0}
#recipe b{display:block;font-size:clamp(14px,2.8vh,20px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:5px;margin-top:3px;flex-wrap:wrap}
.chip{font-size:clamp(18px,4vh,28px);background:#f3ece2;border-radius:10px;padding:2px 5px;position:relative;transition:background .2s}
.chip.got{background:#c9f5d6}
.chip.got::after{content:"✔";position:absolute;right:-5px;top:-5px;font-size:12px;color:#fff;background:#2ecc71;border-radius:50%;width:16px;height:16px;display:grid;place-items:center;font-weight:900}
.steps{display:flex;gap:4px;flex:none}
.steps span{width:clamp(26px,5.5vh,36px);height:clamp(26px,5.5vh,36px);border-radius:50%;display:grid;place-items:center;background:#eee3d4;font-size:clamp(13px,2.8vh,19px);opacity:.55}
.steps span.on{background:var(--accent2);opacity:1;box-shadow:0 0 0 3px var(--accent)}
.steps span.ok{background:#c9f5d6;opacity:1}
#work{position:relative;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:14px;
  background:repeating-linear-gradient(45deg,#ffffff 0 18px,#f7efe4 18px 36px);border:2px solid #0000000d}
#tray{display:grid;gap:7px;grid-template-columns:repeat(3,minmax(0,1fr));min-height:0}
#tray.one{grid-template-columns:minmax(0,1fr)}
.tile{border-radius:16px;background:#fff;border:3px solid #e3d5c2;box-shadow:0 4px 0 #d5c4ad;height:clamp(54px,12.5vh,92px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tile .te{font-size:clamp(26px,6vh,46px)}
.tile .tl{font-size:clamp(9px,1.8vh,12px);font-weight:900;color:#7a5a3a;text-transform:uppercase}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 #d5c4ad}
.tile.used{opacity:.25}
.big{border-radius:18px;height:clamp(58px,13vh,96px);font-weight:900;font-size:clamp(18px,4vh,30px);letter-spacing:1px;color:#fff;
  background:linear-gradient(var(--accent2),var(--accent));box-shadow:0 5px 0 #00000040;display:flex;align-items:center;justify-content:center;gap:10px;text-shadow:0 2px 0 #0003}
.big .be{font-size:1.3em;text-shadow:none}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #00000040}
.big.ding{background:linear-gradient(#8dffb4,#22b866);animation:pulse .6s infinite}
.big.wait{background:#cbbca8;box-shadow:none}
@keyframes pulse{50%{transform:scale(1.04)}}
.hint{text-align:center;font-weight:900;color:#7a5a3a;font-size:clamp(13px,2.6vh,18px);padding:8px}
.bowl{position:relative;height:66%;aspect-ratio:1.6;max-width:80%}
.bowl .back{position:absolute;inset:0 0 auto 0;height:38%;border-radius:50%;background:#e9d3b4;border:4px solid #c9a87c}
.bowl .in{position:absolute;left:12%;right:12%;top:8%;height:46%}
.bowl .in span{position:absolute;font-size:min(8vh,44px);transition:transform .3s}
.bowl .front{position:absolute;left:0;right:0;top:19%;bottom:0;border-radius:0 0 50% 50%/0 0 100% 100%;background:linear-gradient(var(--accent),var(--accent2));border:4px solid #0002;border-top:0}
.bowl .front::after{content:"";position:absolute;left:10%;top:18%;width:22%;height:18%;border-radius:50%;background:#ffffff40}
.bowl.spin .in{animation:swirl .5s}
@keyframes swirl{to{transform:rotate(360deg)}}
.spoon{position:absolute;right:8%;top:-28%;font-size:min(10vh,52px);transform-origin:50% 90%}
.bowl.spin .spoon{animation:stir .5s}
@keyframes stir{25%{transform:rotate(-30deg) translateX(-30%)}75%{transform:rotate(25deg) translateX(20%)}}
.mixdots{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:clamp(14px,3vh,22px);letter-spacing:4px;color:var(--accent)}
.poof{position:absolute;font-size:min(7vh,36px);animation:poof .8s forwards;pointer-events:none}
@keyframes poof{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
.app{position:relative;height:88%;aspect-ratio:1.15;max-width:80%;border-radius:16px;background:linear-gradient(#e7ebef,#b9c2cc);border:4px solid #8a96a3;box-shadow:0 6px 0 #0003;display:flex;flex-direction:column;padding:6%}
.app .lbl{font-weight:900;text-align:center;color:#4a5562;font-size:clamp(11px,2.4vh,16px);letter-spacing:2px}
.app .win{flex:1;margin-top:6%;border-radius:12px;background:#2a2f36;border:4px solid #6c7887;display:grid;place-items:center;position:relative;overflow:hidden}
.app .win span{font-size:min(11vh,58px);opacity:.2;transition:opacity .3s}
.app.full .win span{opacity:1}
.app.cooking .win{background:radial-gradient(#ffb347,#c44a0a);animation:heat .8s infinite}
@keyframes heat{50%{filter:brightness(1.25)}}
.app.cold.cooking .win{background:radial-gradient(#bfe6ff,#3a8fd0)}
.app.grill .win{background:#2a2f36 repeating-linear-gradient(0deg,transparent 0 12px,#555 12px 16px)}
.app.grill.cooking .win{background:radial-gradient(#ff8a3a,#7a1a0a)}
.app .bar{height:10px;border-radius:6px;background:#00000030;margin-top:6%;overflow:hidden}
.app .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd27a,#ff7a1a)}
.app.cold .bar i{background:linear-gradient(90deg,#bfe6ff,#3a8fd0)}
.app .knob{position:absolute;top:5%;width:12%;aspect-ratio:1;border-radius:50%;background:#4a5562}
.app.done .win{animation:none;background:radial-gradient(#fff3c2,#ffb347)}
.app.cold.done .win{background:radial-gradient(#ffffff,#bfe6ff)}
.steam{position:absolute;font-size:min(5vh,28px);opacity:.8;animation:steam 1.4s infinite}
@keyframes steam{0%{transform:translateY(0);opacity:0}30%{opacity:.8}100%{transform:translateY(-40px);opacity:0}}
.dingT{position:absolute;top:-8%;font-weight:900;font-size:clamp(20px,5vh,36px);color:#e74c3c;animation:pulse .5s infinite;text-shadow:0 2px 0 #fff}
.bigPlate{position:relative;height:78%;aspect-ratio:1.5;max-width:86%;display:grid;place-items:center}
.bigPlate::before{content:"";position:absolute;inset:18% 0 0 0;border-radius:50%;background:radial-gradient(#fff 52%,#ececec 53%,#fff 68%);box-shadow:0 6px 0 #0002}
.bigPlate .dish{position:relative;font-size:min(20vh,110px);transform:translateY(-6%);animation:pop .4s}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1) translateY(-6%)}}
.bigPlate .top{position:absolute;font-size:min(6vh,32px);animation:pop .3s}
.orders{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;padding:10px;max-height:100%;overflow:auto}
.order{border-radius:18px;background:#fff;border:3px solid #e3d5c2;box-shadow:0 5px 0 #d5c4ad;padding:8px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:clamp(96px,22vw,150px)}
.order .oe{font-size:clamp(36px,9vh,64px)}
.order .on{font-weight:900;font-size:clamp(11px,2.2vh,15px)}
.order .ow{font-size:clamp(14px,3vh,22px)}
.want{animation:want 1s infinite!important}
@keyframes want{0%,100%{box-shadow:0 0 0 3px #ffc53d,0 0 10px 3px #ffc53d66}50%{box-shadow:0 0 0 6px #ffe38a,0 0 26px 10px #ffc53daa}}
.guest.want{animation:none!important}
.guest.want .face{animation:bounce .7s infinite}
.guest.want .plate{box-shadow:0 0 0 4px #ffc53d,0 0 18px 6px #ffc53daa}
@keyframes bounce{50%{transform:translateY(-10%)}}
.nope{animation:nope .35s!important}
@keyframes nope{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
#pointer{position:fixed;z-index:20;font-size:34px;pointer-events:none;display:none;filter:drop-shadow(0 2px 3px #0008);animation:pt .8s infinite}
@keyframes pt{50%{transform:translateY(-8px)}}
.flyer{position:fixed;width:0;height:0;z-index:25;transition:transform .55s cubic-bezier(.35,-.4,.6,1);pointer-events:none}
.flyer span{position:absolute;transform:translate(-50%,-50%);font-size:44px}
#toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);padding:7px 16px;border-radius:20px;background:#000000c8;color:#fff;font-weight:900;font-size:15px;
  pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap;z-index:22;max-width:94%;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1}
.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:8px;background:#1a0d06d9;backdrop-filter:blur(3px)}
.overlay.hidden{display:none}
.card{width:min(760px,100%);max-height:calc(100dvh - 16px);overflow:auto;padding:12px 16px;text-align:center;background:linear-gradient(#fff8ee,#f3e6d2);
  border-radius:22px;box-shadow:0 24px 70px #000c;display:flex;flex-direction:column;gap:8px;touch-action:pan-y}
.card h1{margin:0;font-size:clamp(22px,4.6vw,34px);color:#c25a12;letter-spacing:1px}
.sub{font-weight:700;color:#7a5a3a;font-size:13px}
.sec{font-weight:900;color:#a58a6a;font-size:11px;letter-spacing:1.2px;text-align:left}
#themes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.th{border-radius:16px;border:3px solid #0000;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff;box-shadow:0 4px 0 #0003}
.th .te{font-size:clamp(26px,5.5vh,42px)}
.th b{font-size:clamp(9px,1.8vh,13px);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #0006}
.th.on{border-color:#ffd23f;box-shadow:0 0 0 3px #ffd23f,0 4px 0 #0003}
#sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.sz{border-radius:13px;border:3px solid #e3d5c2;background:#fff;padding:7px 4px;display:flex;flex-direction:column;align-items:center}
.sz b{font-size:15px}.sz span{font-size:10px;color:#7a5a3a;font-weight:700}
.sz.on{border-color:#e67e22;background:#fff0dc}
.go{padding:13px;border-radius:15px;font-weight:900;font-size:clamp(16px,3.2vh,21px);letter-spacing:1px;color:#fff;background:linear-gradient(#ffb347,#e0601a);box-shadow:0 5px 0 #a13f0a}
.go.alt{background:#c9b49a;box-shadow:0 5px 0 #9a8466}
.ver{font-size:10px;color:#a58a6a;font-weight:800}
.bigE{font-size:clamp(60px,15vh,110px);line-height:1;animation:pop .6s}
@media (orientation:landscape) and (max-height:500px){ .card{padding:8px 12px;gap:5px} .sub{display:none} }
@media (max-width:760px){ #themes{grid-template-columns:repeat(4,minmax(0,1fr))} .th b{font-size:10px} }
@media (orientation:portrait){
  .brand{display:none}
  #room{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,.85fr) minmax(0,1.15fr)}
  .steps span{width:24px;height:24px;font-size:12px}.steps{gap:2px}
}
</style>
</head>
<body>
<main id="app">
  <header id="hud">
    <button class="hb" id="homeBtn" type="button" aria-label="Pick a theme">🏠</button>
    <div class="brand">HOLIDAY KITCHEN <small>v2</small></div>
    <div id="say">Let's cook!</div>
    <div class="stars">⭐ <span id="sStar">0</span></div>
    <button class="hb" id="muteBtn" type="button" aria-label="Sound">🔊</button>
  </header>
  <section id="room">
    <div id="dining"><div id="decor"></div><div id="banner"></div><div id="table"></div><div id="guests"></div></div>
    <div id="kitchen"><div id="recipe"></div><div id="work"></div><div id="tray"></div></div>
  </section>
</main>
<div id="pointer" class="emo">👆</div>
<div id="toast"></div>
<div class="overlay" id="title">
  <div class="card">
    <h1>👩‍🍳 HOLIDAY KITCHEN 👨‍🍳</h1>
    <div class="sub">Guests are hungry! Pick a dish, add the ingredients, mix it, cook it, decorate it — then serve it to the right guest!</div>
    <div class="sec">PICK A PARTY</div>
    <div id="themes"></div>
    <div class="sec">HOW HUNGRY ARE THEY?</div>
    <div id="sizes"></div>
    <button class="go" id="startBtn" type="button">LET'S COOK! 🍳</button>
    <div class="ver">Version 2</div>
  </div>
</div>
<div class="overlay hidden" id="done">
  <div class="card" style="width:min(520px,100%)">
    <div class="bigE emo" id="dE">🦃</div>
    <h1 id="dH">HAPPY THANKSGIVING!</h1>
    <div class="sub" id="dS" style="display:block">You fed everyone!</div>
    <button class="go" id="againBtn" type="button">NEXT MEAL 🍽️</button>
    <button class="go alt" id="newBtn" type="button">PICK A NEW PARTY</button>
  </div>
</div>
<script>
'use strict';
(function(){
['contextmenu','selectstart','dragstart','gesturestart'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
let lastTE=0;
document.addEventListener('touchend',e=>{ const n=Date.now(); if(n-lastTE<350&&e.target.closest('button,.guest')) e.preventDefault(); lastTE=n; },{passive:false});
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
function onTap(el,fn){
  let d=null;
  el.addEventListener('pointerdown',e=>{ if(e.pointerType==='mouse'&&e.button!==0) return; d={x:e.clientX,y:e.clientY,id:e.pointerId}; });
  el.addEventListener('pointerup',e=>{ if(!d||d.id!==e.pointerId) return; const m=Math.hypot(e.clientX-d.x,e.clientY-d.y); d=null; if(m<18){ initAudio(); fn(e); } });
  el.addEventListener('pointercancel',()=>d=null);
}
let AC=null, master=null, muted=false;
function initAudio(){ if(AC){ AC.resume&&AC.resume(); return; }
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=.5; master.connect(AC.destination); }catch(e){ AC=null; } }
function tone(f,d,type,vol,delay,slide){
  if(!AC||muted) return;
  const t0=AC.currentTime+(delay||0), o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t0); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t0+d);
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol||.2,t0+.01); g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0+d+.05);
}
const sfx={
  tap:()=>tone(900,.05,'triangle',.08),
  plop:()=>{ tone(520,.12,'sine',.2,0,180); tone(1200,.06,'triangle',.06,.08); },
  nope:()=>{ tone(260,.12,'triangle',.14); tone(200,.14,'triangle',.12,.1); },
  mix:()=>tone(rnd(300,420),.22,'sine',.12,0,rnd(700,900)),
  door:()=>{ tone(180,.1,'square',.06); tone(140,.12,'square',.05,.08); },
  bubble:()=>tone(rnd(500,900),.06,'sine',.06,0,rnd(1000,1400)),

    tray.innerHTML=cur.tiles.map((x,j)=>'<button class="tile'+(x.i>=0&&cur.added.includes(x.i)?' used':'')+'" type="button" data-j="'+j+'"><span class="te emo">'+x.e+'</span><span class="tl">'+x.n+'</span></button>').join('');
    tray.querySelectorAll('.tile').forEach(b=>onTap(b,()=>addIng(+b.dataset.j,b)));
    say('Put in the '+d.ing.map(x=>x.n).join(', ')+'!');
  } else if(cur.step==='mix'){
    work.innerHTML=bowlHTML(true);
    tray.className='one'; tray.innerHTML='<button class="big" type="button" id="mixBtn"><span class="be emo">🥄</span>'+d.mix+'!</button>';
    onTap($('mixBtn'),doMix); say('Tap '+d.mix+'! '+d.mix+'! '+d.mix+'!');
  } else if(cur.step==='cook'){
    const c=COOK[d.cook];
    work.innerHTML='<div class="app'+(c.grill?' grill':'')+(c.cold?' cold':'')+'" id="app"><span class="knob" style="left:8%"></span><span class="knob" style="right:8%"></span>'+
      '<div class="lbl">'+c.n+' <span class="emo">'+c.e+'</span></div><div class="win"><span class="emo" id="inDish">🥣</span></div><div class="bar"><i id="cookBar"></i></div></div>';
    tray.className='one'; tray.innerHTML='<button class="big" type="button" id="cookBtn"><span class="be emo">'+c.e+'</span>'+c.put+'</button>';
    onTap($('cookBtn'),doCook); say(c.put.charAt(0)+c.put.slice(1).toLowerCase()+'!');
  } else if(cur.step==='decor'){
    work.innerHTML=plateHTML(); cur.tops=[];
    tray.innerHTML=d.top.map(t=>'<button class="tile" type="button" data-t="'+t+'"><span class="te emo">'+t+'</span><span class="tl">ADD</span></button>').join('');
    if(d.top.length<3) tray.style.gridTemplateColumns='repeat('+d.top.length+',minmax(0,1fr))';
    tray.querySelectorAll('.tile').forEach(b=>onTap(b,()=>addTop(b.dataset.t)));
    say('Decorate it! Tap the toppings!');
  } else if(cur.step==='serve'){
    work.innerHTML=plateHTML();
    tray.className='one'; tray.innerHTML='<div class="hint">Who wants the <b>'+d.n+'</b>? Tap them! <span class="emo">👉</span></div>';
    say('Who wants the '+d.n+'? Tap them!');
  }
  syncGlow();
}
function startDish(k){ sfx.tap(); cur={k,d:TH().dishes[k],step:'add',added:[],mix:0,cook:0,cookT:0,tops:[],tiles:null}; renderKitchen(); }
function nextStep(){ if(!cur) return; const st=stepsOf(cur.d); cur.step=st[st.indexOf(cur.step)+1]; cur.adv=0; renderKitchen(); }
function addIng(j,el){
  const x=cur.tiles[j];
  if(x.i<0){ nope(el,'Silly! No '+x.n+' in '+cur.d.n+'! 🙃'); return; }
  if(cur.added.includes(x.i)) return;
  cur.added.push(x.i); el.classList.add('used'); idleT=0;
  fly(el,$('bowl'),x.e,()=>{ sfx.plop(); renderRecipe(); $('bowlIn').innerHTML=inBowl();
    if(cur.added.length===cur.d.ing.length&&!cur.adv){ cur.adv=1; G.busy=true; setTimeout(()=>{ G.busy=false; nextStep(); },600); } });
  syncGlow();
}
const MIXN=6;
function doMix(){
  if(cur.mix>=MIXN) return;
  cur.mix++; sfx.mix();
  const b=$('bowl'); b.classList.remove('spin'); void b.offsetWidth; b.classList.add('spin');
  $('mixDots').textContent='●'.repeat(cur.mix)+'○'.repeat(MIXN-cur.mix);
  for(let i=0;i<3;i++) poof(b,pick(['✨','💫',cur.d.ing[i%cur.d.ing.length].e]));
  if(cur.mix>=MIXN&&!cur.adv){ cur.adv=1; $('bowlIn').innerHTML='<span class="emo" style="left:30%;top:0%;font-size:min(10vh,54px)">'+cur.d.e+'</span>'; G.busy=true; syncGlow(); setTimeout(()=>{ G.busy=false; nextStep(); },700); }
}
function doCook(){
  const c=COOK[cur.d.cook], btn=$('cookBtn'), app=$('app');
  if(cur.cook===0){ cur.cook=1; cur.cookT=0; sfx.door(); app.classList.add('full','cooking');
    btn.className='big wait'; btn.innerHTML='<span class="be emo">⏳</span>'+(c.cold?'CHILLING…':'COOKING…'); say(c.cold?'Chilling… brrr! ❄️':'Cooking… smells yummy! '+c.e); syncGlow(); return; }
  if(cur.cook===1){ nope(btn,'Wait for the DING!'); return; }
  if(cur.cook===2){ sfx.door(); cur.cook=3; nextStep(); }
  return;
}
function addTop(t){
  if(cur.tops.length>=3) return;
  cur.tops.push(t); sfx.top();
  const p=$('plate'), s=document.createElement('span'); s.className='top emo'; s.textContent=t; s.setAttribute('style',TOPPOS[(cur.tops.length-1)%5]); p.appendChild(s);
  poof(p,'✨');
  if(cur.tops.length>=3&&!cur.adv){ cur.adv=1; G.busy=true; say('So pretty! ✨'); setTimeout(()=>{ G.busy=false; nextStep(); },700); }
  syncGlow();
}
function serveTo(g,w){
  const dish=$('plate').querySelector('.dish'), pl=g.el.querySelector('.plate span');
  w.done=true; const d=cur.d, tops=cur.tops.slice(); cur=null; G.busy=true;
  fly(dish,g.el.querySelector('.plate'),d.e,()=>{
    pl.textContent=d.e+(tops[0]||''); pl.style.opacity=1; pl.style.transform='translateY(-22%)';
    sfx.yum(); g.el.classList.remove('munch'); void g.el.offsetWidth; g.el.classList.add('munch');
    talk(g,pick(['YUM!','Delicious!','Mmm, '+d.n+'!','Thank you!','Yummy yummy!']));
    hearts(g.el,4); addStars(1); sfx.star();
    g.el.querySelectorAll('.wish').forEach((s,i)=>s.classList.toggle('done',g.wants[i].done));
    setTimeout(()=>{ pl.style.opacity=0; },1600);
    if(g.wants.every(x=>x.done)){ g.happy=true; g.el.classList.add('happy'); setTimeout(()=>{ talk(g,'I\'m so full! 😄'); hearts(g.el,6); },1400); }
    setTimeout(()=>{ G.busy=false; if(!orders().length) mealDone(); else renderKitchen(); },1100);
  });
  work.innerHTML=''; tray.innerHTML=''; say('Here you go, '+g.name+'!'); syncGlow();
}
function mealDone(){
  const t=TH(); addStars(3); sfx.fanfare(); confetti(70);
  if(t.fireworks){ fireworks(); sfx.boom(); setTimeout(sfx.boom,900); }
  for(const g of G.guests) hearts(g.el,5,['❤️','⭐','🎉']);
  setTimeout(()=>{ $('dE').textContent=t.e; $('dH').textContent=t.banner; $('dS').textContent=t.done+' +3 ⭐'; $('done').classList.remove('hidden'); },t.fireworks?2400:1500);
}
function fireworks(){
  for(let b=0;b<6;b++) setTimeout(()=>{ const x=rnd(10,90), y=rnd(10,45);
    for(let i=0;i<12;i++){ const s=document.createElement('span'); s.className='poof emo'; s.textContent=pick(['✨','⭐','💥']); s.style.position='fixed'; s.style.zIndex=27;
      s.style.left=x+'vw'; s.style.top=y+'vh'; const a=i/12*6.28; s.style.setProperty('--dx',Math.cos(a)*90+'px'); s.style.setProperty('--dy',Math.sin(a)*90+'px'); s.style.animationDuration='1.1s';
      s.style.filter='hue-rotate('+pick([0,140,220])+'deg)'; document.body.appendChild(s); setTimeout(()=>s.remove(),1200); } },b*350);
}
function fly(fromEl,toEl,emo,done){
  const a=fromEl.getBoundingClientRect(), b=toEl.getBoundingClientRect();
  const f=document.createElement('div'); f.className='flyer'; f.innerHTML='<span class="emo">'+emo+'</span>';
  f.style.left=(a.left+a.width/2)+'px'; f.style.top=(a.top+a.height/2)+'px'; document.body.appendChild(f);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ f.style.transform='translate('+(b.left+b.width/2-a.left-a.width/2)+'px,'+(b.top+b.height*.4-a.top-a.height/2)+'px) scale(.85)'; }));
  setTimeout(()=>{ f.remove(); done&&done(); },580);
}
function poof(el,emo){ const s=document.createElement('span'); s.className='poof emo'; s.textContent=emo; s.style.left=rnd(20,70)+'%'; s.style.top=rnd(10,50)+'%';
  s.style.setProperty('--dx',rnd(-60,60)+'px'); s.style.setProperty('--dy',rnd(-70,-20)+'px'); el.appendChild(s); setTimeout(()=>s.remove(),850); }
function nope(el,msg){ el.classList.remove('nope'); void el.offsetWidth; el.classList.add('nope'); sfx.nope(); if(msg) toast(msg); }
let toastT=null;
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),2000); }
function say(t){ $('say').textContent=t; }
function confetti(n){ for(let i=0;i<n;i++){ const s=document.createElement('span'); s.className='fall emo'; s.textContent=pick(TH().fall.concat(['🎉','⭐','✨']));
  s.style.left=rnd(0,100)+'vw'; s.style.position='fixed'; s.style.zIndex=26; s.style.fontSize=rnd(16,34)+'px'; s.style.animationDuration=rnd(2,4)+'s'; s.style.animationDelay=rnd(0,.8)+'s';
  s.style.setProperty('--dx',rnd(-80,80)+'px'); s.style.setProperty('--r',rnd(-360,360)+'deg'); document.body.appendChild(s); setTimeout(()=>s.remove(),5000); } }
let fallT=0;
function fallTick(dt){ fallT-=dt; if(fallT>0) return; fallT=rnd(.7,1.3);
  const d=$('dining'), s=document.createElement('span'); s.className='fall emo'; s.textContent=pick(TH().fall);
  s.style.left=rnd(0,95)+'%'; s.style.fontSize=rnd(14,26)+'px'; s.style.animationDuration=rnd(6,10)+'s'; s.style.opacity=.85;
  s.style.setProperty('--dx',rnd(-60,60)+'px'); s.style.setProperty('--r',rnd(-200,200)+'deg'); d.appendChild(s); setTimeout(()=>s.remove(),10500); }
let idleT=0;
function syncGlow(){
  document.querySelectorAll('.want').forEach(e=>e.classList.remove('want'));
  if(!G||G.busy||!$('title').classList.contains('hidden')||!$('done').classList.contains('hidden')) return;
  let el=null;
  if(!cur) el=work.querySelector('.order');
  else if(cur.step==='add'){ if(idleT>2.5){ const j=cur.tiles.findIndex(x=>x.i>=0&&!cur.added.includes(x.i)); el=tray.querySelector('.tile[data-j="'+j+'"]'); } }
  else if(cur.step==='mix') el=$('mixBtn');
  else if(cur.step==='cook'){ if(cur.cook!==1) el=$('cookBtn'); }
  else if(cur.step==='decor') el=tray.querySelector('.tile');
  else if(cur.step==='serve'){ for(const g of G.guests) if(g.wants.some(w=>w.k===cur.k&&!w.done)) g.el.classList.add('want'); const f=G.guests.find(g=>g.el.classList.contains('want')); el=f&&f.el; }
  if(el) el.classList.add('want');
}
function placePointer(){
  const el=document.querySelector('.want'), p=$('pointer');
  if(!el){ p.style.display='none'; return; }
  const tgt=el.classList.contains('guest')?el.querySelector('.plate').getBoundingClientRect():el.getBoundingClientRect();
  p.style.display='block'; p.style.left=(tgt.left+tgt.width/2-14)+'px'; p.style.top=(tgt.bottom-12)+'px';
}
let last=performance.now(), bubT=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(G&&$('title').classList.contains('hidden')){
    fallTick(dt);
    if(cur&&cur.step==='add'){ const was=idleT>2.5; idleT+=dt; if(!was&&idleT>2.5) syncGlow(); }
    if(cur&&cur.step==='cook'&&cur.cook===1){
      const c=COOK[cur.d.cook]; cur.cookT+=dt; const k=Math.min(1,cur.cookT/c.time);
      const bar=$('cookBar'); if(bar) bar.style.width=(k*100)+'%';
      bubT-=dt; if(bubT<=0){ bubT=.25; if(!c.cold) sfx.bubble(); const a=$('app'); if(a){ const s=document.createElement('span'); s.className='steam emo'; s.textContent=c.cold?'❄️':'💨'; s.style.left=rnd(20,70)+'%'; s.style.top='18%'; a.appendChild(s); setTimeout(()=>s.remove(),1400); } }
      if(k>=1){ cur.cook=2; sfx.ding(); const a=$('app'); a.classList.remove('cooking'); a.classList.add('done'); $('inDish').textContent=cur.d.e;
        const d2=document.createElement('div'); d2.className='dingT'; d2.textContent='DING!'; a.appendChild(d2);
        const b=$('cookBtn'); b.className='big ding'; b.innerHTML='<span class="be emo">🧤</span>TAKE IT OUT!'; say('DING! It\'s ready! Take it out!'); syncGlow(); }
    }
  }
  placePointer();
  requestAnimationFrame(frame);
}
function buildTitle(){
  $('themes').innerHTML=Object.keys(THEMES).map(k=>{ const t=THEMES[k]; return '<button class="th'+(k===themeKey?' on':'')+'" type="button" data-k="'+k+'" style="background:'+t.tile+'"><span class="te emo">'+t.e+'</span><b>'+t.n+'</b></button>'; }).join('');
  $('themes').querySelectorAll('.th').forEach(b=>onTap(b,()=>{ themeKey=b.dataset.k; sfx.tap(); buildTitle(); applyTheme(); }));
  $('sizes').innerHTML=Object.keys(SIZES).map(k=>'<button class="sz'+(k===sizeKey?' on':'')+'" type="button" data-k="'+k+'"><b>'+SIZES[k].n+'</b><span>'+SIZES[k].d+'</span></button>').join('');
  $('sizes').querySelectorAll('.sz').forEach(b=>onTap(b,()=>{ sizeKey=b.dataset.k; sfx.tap(); buildTitle(); }));
}
onTap($('startBtn'),()=>{ applyTheme(); $('title').classList.add('hidden'); newMeal(); sfx.star(); });
onTap($('againBtn'),()=>{ $('done').classList.add('hidden'); newMeal(); });
onTap($('newBtn'),()=>{ $('done').classList.add('hidden'); buildTitle(); $('title').classList.remove('hidden'); });
onTap($('homeBtn'),()=>{ buildTitle(); $('title').classList.remove('hidden'); syncGlow(); });
onTap($('muteBtn'),()=>{ muted=!muted; $('muteBtn').textContent=muted?'🔇':'🔊'; });
window.addEventListener('resize',sizeFaces);
$('sStar').textContent=stars;
buildTitle(); applyTheme();
G={guests:[],busy:false};
requestAnimationFrame(frame);
window.__HK={get cur(){return cur},get G(){return G},hint:()=>{idleT=9;syncGlow();}};
})();
</script>
